# fly.toml app configuration file generated for speedtyper on 2026-05-07T09:48:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'speedtyper'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
